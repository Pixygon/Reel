[package]
name = "reel"
version = "1.10.0"
edition = "2021"
description = "Reel — a cross-platform video player and editor. Better-than-VLC playback, Premiere-class editing. Linux-first."
license = "MIT"

[[bin]]
name = "reel"
path = "src/main.rs"

[dependencies]
# Window + GPU + UI — the proven Pixygon native stack (matches Infinite).
winit = "0.30"
wgpu = "24"
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = { version = "0.31", features = ["accesskit"] }
pollster = "0.4"
bytemuck = { version = "1.18", features = ["derive"] }

# Video decode (v0.1): drive the system ffmpeg as a subprocess and pipe raw
# RGBA frames. ffmpeg 9 / libav 63 is too new for the ffmpeg-next bindings, and
# the subprocess path is codec-complete and rock-solid. The roadmap moves the
# hot path to libmpv / libav + libplacebo for the beat-VLC performance bar.
ffmpeg-sidecar = "2"

# Native file-open dialog (Open… button).
rfd = { version = "0.15", default-features = false, features = ["tokio", "xdg-portal"] }

# Still-image decode (instant open of png/jpg/webp/… into the same GPU path).
image = "0.25"

# Milestone 1: libmpv is dlopen'd at runtime when present (hardware decode,
# A/V sync, audio, exact seek) — never linked, so builds and machines without
# it fall back to the subprocess decoder.
libloading = "0.8"

anyhow = "1"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.45"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = "thin"

[target.'cfg(target_os = "windows")'.dependencies]
# The Windows mixer speaks WASAPI through cpal. Linux deliberately does NOT
# use cpal (its ALSA backend is dead on PipeWire-only desktops) — see
# audio.rs for the native PipeWire stream.
cpal = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
ksni = "0.3.6"
pipewire = { git = "https://gitlab.freedesktop.org/pipewire/pipewire-rs" }
tokio = { version = "1", features = ["rt"] }
